<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Munmek Lookup</title>
  <style>
    body { margin: 0; min-width: 300px; font-family: Georgia, 'Times New Roman', serif; background: linear-gradient(180deg, #f1ede4, #faf8f3); color: #1e1b16; }
    .panel { padding: 18px; }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0 0 12px; line-height: 1.5; color: #5c5548; }
    button { border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 700; background: #2f5d62; color: white; cursor: pointer; }
    button:hover { filter: brightness(1.05); }
    .note { margin-top: 12px; font-size: 0.85rem; color: #6c6458; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Munmek</h1>
    <p>Hover Korean text to see the local dictionary lookup and the on-demand Gemini and Anki actions inside the in-page popup.</p>
    <button id="open-settings">Open Settings</button>
    <div class="note">The main interaction now lives in the hover tooltip, not this browser action popup.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
