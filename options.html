<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Korean Lookup Options</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f7f6; color: #333; }
    h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .container { background-color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 20px; margin-bottom: 8px; font-weight: bold; color: #34495e; }
    input[type="text"], input[type="password"], input[type="file"], textarea {
      width: calc(100% - 24px); /* Account for padding */
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }
    textarea { min-height: 150px; resize: vertical; }
    button {
      padding: 12px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }
    button:hover { background-color: #2980b9; }
    #status { margin-top: 25px; font-weight: bold; padding: 10px; border-radius: 4px; text-align: center; }
    .success { background-color: #e8f5e9; color: #2e7d32; }
    .error { background-color: #ffebee; color: #c62828; }
    #srtFileInfo { font-size: 0.9em; color: #7f8c8d; margin-top: -10px; margin-bottom: 15px; }
    .prompt-variables { font-size: 0.85em; color: #555; margin-bottom: 10px; background-color: #ecf0f1; padding: 8px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Korean Lookup Extension Settings</h1>

    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="Enter your Gemini API Key">

    <label for="modelId">Gemini Model ID:</label>
    <input type="text" id="modelId" placeholder="e.g., gemini-pro, gemini-1.5-flash-latest">

    <label for="srtFile">Upload SRT Subtitle File (Optional):</label>
    <input type="file" id="srtFile" accept=".srt">
    <div id="srtFileInfo">No SRT file currently loaded.</div>

    <label for="aiPrompt">Custom AI Prompt:</label>
    <div class="prompt-variables">
      Available variables: <code>{WORD}</code>, <code>{SENTENCE}</code>, <code>{PREV_SENTENCE}</code>, <code>{NEXT_SENTENCE}</code>
    </div>
    <textarea id="aiPrompt" placeholder="Define how the AI should process the text and the desired JSON output structure..."></textarea>

    <button id="save">Save Settings</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
